name: Build hongguo unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "ios/**"
      - "scripts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "MiniReel-0.3.2-android-arm64-v8a/assets/flutter_assets/assets/config/sources.json"
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read

concurrency:
  group: hongguo-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Load source settings from sources.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_file = Path(
              "MiniReel-0.3.2-android-arm64-v8a/assets/flutter_assets/assets/config/sources.json"
          )
          if not source_file.is_file():
              raise SystemExit(f"Missing source configuration: {source_file}")

          config = json.loads(source_file.read_text(encoding="utf-8"))
          source = config.get("sources", {}).get("hongguo")
          if not isinstance(source, dict) or source.get("enabled") is not True:
              raise SystemExit("sources.json does not contain an enabled sources.hongguo entry")

          required = ("baseUrl", "playbackEndpoint", "referer", "mediaReferer")
          missing = [key for key in required if not source.get(key)]
          if missing:
              raise SystemExit("Missing sources.json keys: " + ", ".join(missing))

          # --dart-define-from-file expects a flat JSON object. Keep every value
          # as a string so the same file works with Flutter's compile-time defines.
          defines = {
              "HONGGUO_GATEWAY": str(source["baseUrl"]).rstrip("/"),
              "HONGGUO_BASE_URL": str(source["baseUrl"]).rstrip("/"),
              "HONGGUO_PLAYBACK_ENDPOINT": str(source["playbackEndpoint"]),
              "HONGGUO_REFERER": str(source["referer"]),
              "HONGGUO_MEDIA_REFERER": str(source["mediaReferer"]),
              "HONGGUO_APP_BASE_URL": str(source.get("appBaseUrl", "")),
              "HONGGUO_APP_USER_AGENT": str(source.get("appUserAgent", "")),
              "HONGGUO_MAX_PAGES": str(source.get("maxPages", 20)),
              "HONGGUO_PAGE_SIZE": str(source.get("pageSize", 24)),
              "HONGGUO_TIMEOUT_SECONDS": str(source.get("timeoutSeconds", 12)),
              "HONGGUO_RETRIES": str(source.get("retries", 3)),
              "HONGGUO_APP_PARAMETERS_JSON": json.dumps(
                  source.get("appParameters", {}),
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              "HONGGUO_APP_HEADERS_JSON": json.dumps(
                  source.get("appHeaders", {}),
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
          }
          out = Path("build-config")
          out.mkdir(exist_ok=True)
          define_file = out / "dart-defines.json"
          define_file.write_text(
              json.dumps(defines, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Loaded enabled Hongguo source config from {source_file}")
          print(f"Playback endpoint configured: {defines['HONGGUO_PLAYBACK_ENDPOINT']}")
          print(f"Flutter compile-time definitions written to {define_file}")
          PY

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          flutter pub get

          # Work around a Swift-source compatibility regression in the newest
          # shared_preferences_foundation generated code while keeping the
          # workaround local to CI (no tracked project files are modified).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          text = p.read_text()
          if "dependency_overrides:" not in text:
              text += "\n# CI compatibility override for unsigned iOS builds\ndependency_overrides:\n  shared_preferences_foundation: 2.5.6\n"
          elif not re.search(r"(?m)^  shared_preferences_foundation:", text):
              text += "\n  shared_preferences_foundation: 2.5.6\n"
          else:
              text = re.sub(r"(?m)^  shared_preferences_foundation:.*$", "  shared_preferences_foundation: 2.5.6", text)
          p.write_text(text)
          PY
          flutter pub get
          flutter pub deps --style=compact | grep -E 'shared_preferences(_foundation)? ' || true

      - name: Build Runner.app without code signing
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=build-config/dart-defines.json
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)
          IPA_NAME="hongguo-${VERSION}-unsigned.ipa"
          STAGING="$RUNNER_TEMP/ipa-staging"
          OUT_DIR="$RUNNER_TEMP/ipa-output"
          rm -rf "$STAGING" "$OUT_DIR"
          mkdir -p "$STAGING/Payload" "$OUT_DIR"
          ditto build/ios/iphoneos/Runner.app "$STAGING/Payload/Runner.app"
          (cd "$STAGING" && /usr/bin/zip -qry "$OUT_DIR/$IPA_NAME" Payload)
          test -s "$OUT_DIR/$IPA_NAME"
          /usr/bin/unzip -t "$OUT_DIR/$IPA_NAME"
          /usr/bin/unzip -Z1 "$OUT_DIR/$IPA_NAME" | grep -q '^Payload/Runner.app/Info.plist$'
          if /usr/bin/unzip -Z1 "$OUT_DIR/$IPA_NAME" | grep -q 'embedded.mobileprovision'; then
            echo "Unexpected embedded provisioning profile in unsigned IPA" >&2
            exit 1
          fi
          shasum -a 256 "$OUT_DIR/$IPA_NAME" | tee "$OUT_DIR/SHA256SUMS.txt"
          echo "IPA_PATH=$OUT_DIR/$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-unsigned-ipa
          path: |
            ${{ runner.temp }}/ipa-output/*.ipa
            ${{ runner.temp }}/ipa-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
